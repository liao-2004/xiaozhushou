name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '发版号（如 1.0.1），留空则按 package.json'
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖
        run: npm install

      - name: 决定版本号
        id: ver
        shell: pwsh
        run: |
          $v = ''
          if ('${{ github.ref }}' -like 'refs/tags/v*') { $v = '${{ github.ref }}'.Substring(10) }
          elseif ('${{ github.event.inputs.version }}') { $v = '${{ github.event.inputs.version }}' }
          if (-not $v) { $v = node -p "require('./package.json').version" }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "版本号: $v"

      - name: 打包并发布到 GitHub Release
        run: npx electron-builder --win --publish always -c.version=${{ steps.ver.outputs.version }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

      - name: 上传安装包为产物
        uses: actions/upload-artifact@v4
        with:
          name: OnOffScheduler-v${{ steps.ver.outputs.version }}
          path: release/*.exe
          if-no-files-found: error
